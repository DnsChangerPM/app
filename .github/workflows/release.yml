name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.0) — this becomes the release tag "vX.Y.Z"'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Determine version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          echo "$V" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "::error::Version must be in X.Y.Z format without leading zeroes"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Apply version
        run: |
          V="$VERSION"
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f2)
          PATCH=$(echo "$V" | cut -d. -f3)
          # Keep the existing versionCode scheme monotonic (including 1.0.1+10001).
          if [ "${#MINOR}" -gt 2 ] || [ "${#PATCH}" -gt 2 ] || [ "${#MAJOR}" -gt 6 ] || [ "$MAJOR" -gt 210000 ]; then
            echo "::error::Minor/patch must be 0..99 and major at most 210000."
            exit 1
          fi
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          if [ "$CODE" -lt 1 ] || [ "$CODE" -gt 2100000000 ]; then
            echo "::error::Version code is outside Android's supported range."
            exit 1
          fi
          sed -i -E "s/^version: .*/version: $V+$CODE/" pubspec.yaml
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Require stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for SECRET in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!SECRET}" ]; then
              echo "::error::$SECRET is required to publish an installable update. Configure the SAME signing key used by the installed release."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.p12
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=key.p12
          storeType=PKCS12
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || secrets.CLOUDFLARE_WORKER_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "Using the configured build-time API endpoint."
            flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            echo "Using the default build-time API endpoint (not editable in the app)."
            flutter build apk --release
          fi

      - name: Test native VPN lifecycle
        run: bash android/gradlew -p android testReleaseUnitTest --no-daemon

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "DNS-Changer-v$VERSION.apk"
          ls -la *.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "DNS Changer v${{ env.VERSION }}"
          body: "${{ github.event.inputs.notes }}"
          files: "DNS-Changer-v${{ env.VERSION }}.apk"
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Notify Cloudflare admin (disable old versions)
        env:
          WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "Skipping worker notify: CLOUDFLARE_WORKER_URL / ADMIN_KEY secrets not set."
            exit 0
          fi
          curl --fail-with-body --retry 3 --connect-timeout 10 --max-time 30 -sS -X POST "$WORKER_URL/api/admin/config" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: $ADMIN_KEY" \
            -d "{\"min_version\":\"$VERSION\"}"
