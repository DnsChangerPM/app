name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            {
              echo "### Build failed"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "e: |error:|FAILURE:|What went wrong|Caused by|Unresolved reference" build.log | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $STATUS
          fi

      - name: Test native VPN lifecycle
        run: bash android/gradlew -p android testReleaseUnitTest --no-daemon
