name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            {
              echo "### Build failed"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "e: |error:|FAILURE:|What went wrong|Caused by|Unresolved reference" build.log | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $STATUS
          fi

      - name: Test native VPN lifecycle
        run: |
          set +e
          bash android/gradlew -p android testReleaseUnitTest --no-daemon > native-test.log 2>&1
          STATUS=$?
          cat native-test.log
          if [ $STATUS -ne 0 ]; then
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          def emit(title, message):
              global found
              found = True
              def escape(value):
                  return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title={escape(title)}::{escape(message)}")

          for path in glob.glob('build/app/test-results/testReleaseUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      emit(case.get('name', 'Native test failed'),
                           failure.get('message') or (failure.text or 'Native unit test failed'))

          if not found:
              with open('native-test.log', errors='replace') as log:
                  lines = log.readlines()
              emit('Native Gradle task failed', ''.join(lines[-80:]))
          PY
            exit $STATUS
          fi

      - name: Test Cloudflare Worker helpers
        run: npm test
        working-directory: cloudflare
