name: Debug tests

on:
  push:
    branches: ['arena/01a08818-app']

jobs:
  test-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests (machine output)
        run: |
          set +e
          flutter test --machine > /tmp/machine.log 2>&1
          echo "TEST_EXIT=$?" >> "$GITHUB_ENV"
          echo "LOG_LINES=$(wc -l < /tmp/machine.log)" >> "$GITHUB_ENV"

      - name: Surface failures as annotations
        if: always()
        run: |
          echo "::error::DEBUG-MARKER log_lines=$LOG_LINES exit=$TEST_EXIT"
          python3 - <<'PY'
          import json

          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          tests = {}
          errors = {}
          n_start = 0
          n_done = 0
          n_fail = 0
          n_err = 0
          for raw in open('/tmp/machine.log', encoding='utf-8', errors='replace'):
              line = raw.strip()
              if not line:
                  continue
              try:
                  ev = json.loads(line)
              except Exception:
                  continue
              t = ev.get('type')
              if t == 'testStart':
                  n_start += 1
                  test = ev.get('test') or {}
                  url = test.get('url') or ''
                  fname = url.split('/')[-1] if url else 'unknown'
                  tests[test.get('id')] = (test.get('name') or '?', fname)
              elif t == 'error':
                  n_err += 1
                  tid = ev.get('testID')
                  errors.setdefault(tid, []).append(ev.get('error') or '')
              elif t == 'testDone':
                  n_done += 1
                  if ev.get('result') in ('failure', 'error') and not ev.get('hidden'):
                      n_fail += 1
                      tid = ev.get('testID')
                      name, fname = tests.get(tid, ('?', '?'))
                      msg = errors.get(tid) or ['(no message)']
                      text = ' | '.join(x for x in msg if x).strip()
                      print(f"::error file={fname},line=1,col=1::{esc(name + ' :: ' + text[:1200])}")
          print(f"::error::DEBUG-STATS start={n_start} done={n_done} fail={n_fail} err_events={n_err}")
          PY
