name: Debug tests

on:
  push:
    branches: ['arena/01a08818-app']

jobs:
  test-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests (machine output)
        run: |
          set +e
          flutter test --machine > /tmp/machine.log 2>&1
          echo "TEST_EXIT=$?" >> "$GITHUB_ENV"
          echo "LOG_LINES=$(wc -l < /tmp/machine.log)" >> "$GITHUB_ENV"

      - name: Surface failures as annotations
        if: always()
        run: python3 scripts/surface_test_failures.py /tmp/machine.log
